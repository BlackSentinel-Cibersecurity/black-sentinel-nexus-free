version: '3.8'

services:
  api:
    image: ghcr.io/blacksentinel-cibersecurity/black-sentinel-nexus-free/api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: bsn-api
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_TYPE=sqlite
      - DATABASE_PATH=/app/data/black_sentinel.db
      - JWT_SECRET=${JWT_SECRET:-change-this-to-a-secure-random-string}
      - JWT_EXPIRES_IN=24h
      - CORS_ORIGIN=http://localhost:3000
    volumes:
      - bsn-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3001/api/v1/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  web:
    image: ghcr.io/blacksentinel-cibersecurity/black-sentinel-nexus-free/web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: bsn-web
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - NEXT_PUBLIC_WS_URL=http://localhost:3001
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  bsn-data:
    driver: local
